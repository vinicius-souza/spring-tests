version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456#root
      MYSQL_DATABASE: starwars
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456#
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

# mysql://user:123456#@localhost:3306/starwars